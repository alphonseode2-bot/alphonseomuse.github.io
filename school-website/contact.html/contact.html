<section class="welcome">

    <h2>Contact Us</h2>

    <p><strong>Address:</strong> P.O. Box 123, Nairobi, Kenya</p>

    <p><strong>Phone:</strong> +254 700 000 000</p>

    <p><strong>Email:</strong> info@greenvalleyschool.example</p>

    <br>

    <h3>Send Us a Message</h3>

    <form>

        <p>
            <input type="text"
                   placeholder="Your Name"
                   required>
        </p>

        <p>
            <input type="email"
                   placeholder="Your Email"
                   required>
        </p>

        <p>
            <textarea
                placeholder="Your Message"
                rows="6"
                required></textarea>
        </p>

        <button type="submit" class="button">
            Send Message
        </button>

    </form>
